# A workspace of just tgg-cli and tgg-mod, so the image builds `tgg` without the
# rest of the core workspace and its git dependencies. The flake copies both
# crates in from texturesgg/texturesgg; Cargo.lock beside this file pins their
# dependencies.
[workspace]
members = ["tgg-mod", "tgg-cli"]
resolver = "2"

[workspace.package]
license = "GPL-3.0-or-later"
authors = ["SaavyLab LLC <jayson@saavylab.com>"]
repository = "https://github.com/texturesgg/texturesgg"

[workspace.lints.rust]
unsafe_code = "forbid"
