# A workspace of just tgg-mod, so the image builds it without the rest of the
# core workspace and its git dependencies. The flake copies the crate in from
# texturesgg/texturesgg; Cargo.lock beside this file pins its dependencies.
[workspace]
members = ["tgg-mod"]
resolver = "2"

[workspace.package]
license = "GPL-3.0-or-later"
authors = ["SaavyLab LLC <jayson@saavylab.com>"]
repository = "https://github.com/texturesgg/texturesgg"

[workspace.lints.rust]
unsafe_code = "forbid"
