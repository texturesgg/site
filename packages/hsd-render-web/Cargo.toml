[package]
name = "hsd-render-web"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description = "Browser adapter: hsd-render drawing the site's 3D preview on a canvas"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Build exactly one per wasm-pack run. The site loads the small WebGPU build
# by default and the WebGL2 build (wgpu's GL backend and runtime shader
# translation, ~5x larger) only where WebGPU is unavailable.
webgpu = []
webgl = ["wgpu/webgl"]
# Panic messages on the console, for development
# (`pnpm --filter @vgskins/hsd-render build:debug-panics`);
# release builds leave it off.
debug-panics = ["dep:console_error_panic_hook"]

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
dat-parser = "0.2.0"
melee-dat = "0.2.0"
hsd-render = { version = "0.2.0", default-features = false }
js-sys = "0.3"
raw-window-handle = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
# Keep in lockstep with hsd-render's wgpu.
wgpu = "29.0.4"

# The catalog test compares the site's copy with the crate's.
[dev-dependencies]
melee-dat = "0.2.0"
serde_json = "1"

[lints]
workspace = true
