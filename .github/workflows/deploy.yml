name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_ASSETS_URL: ${{ vars.VITE_ASSETS_URL }}
  VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
  VITE_ENABLE_EMAIL_PASSWORD_AUTH: "true"

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    # WarpBuild runner: warp-ubuntu-latest-x64-4x
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Read the pinned Rust version
        id: rust
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-pack@0.14.0
      - name: Install Binaryen
        uses: sigoden/install-binary@7eb4b088aedf19fe9b2bc6c6bbdc12379ffb355c # v1.2.0
        with:
          repo: WebAssembly/binaryen
          tag: version_117
          name: wasm-opt
          cache: true

      - name: Build DAT parser WASM
        run: pnpm build:wasm

      - name: Apply production migrations
        run: pnpm db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The code mod builder image: reused when packages/mod-build/image's
      # inputs are unchanged, built from pinned sources when they change.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Install crane
        run: nix profile install nixpkgs#crane
      - name: Prepare the code mod build pipeline
        run: packages/mod-build/scripts/prepare-deploy.sh production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production workers
        run: pnpm deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Builds for a layout the new builder image added: each mod's latest
      # approved release that has none for it.
      - name: Build releases for new layouts
        run: packages/mod-build/scripts/build-layouts.sh production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
